{% extends "core/base.html" %}
{% block body %}
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark" style="width:44px;height:44px;font-size:22px;">A</div>
      <div>
        <div class="brand-name" style="font-size:20px;">Evoque Assets</div>
        <div class="brand-sub">Admin Console</div>
      </div>
    </div>
    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in to access the admin panel</div>

    {% if error %}
      <div class="alert alert-error" style="margin-bottom:20px;">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group" style="margin-bottom:16px;">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" autofocus autocomplete="username" required/>
      </div>
      <div class="form-group" style="margin-bottom:24px;">
        <label>Password</label>
        <div style="position:relative;">
          <input type="password" name="password" id="pwd" placeholder="Enter password" autocomplete="current-password" required style="padding-right:42px;"/>
          <button type="button" onclick="togglePwd()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;" title="Show/hide password">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%;justify-content:center;padding:13px;font-size:14px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </form>

    <div class="login-lock" style="margin-top:24px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      Secured with encrypted session authentication
    </div>
    <div class="login-hint" style="margin-top:10px;">Staff &amp; Superuser access only</div>
  </div>
</div>
<script>
function togglePwd() {
  const p = document.getElementById('pwd');
  const i = document.getElementById('eye-icon');
  if (p.type === 'password') {
    p.type = 'text';
    i.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    p.type = 'password';
    i.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}
</script>
{% endblock %}
